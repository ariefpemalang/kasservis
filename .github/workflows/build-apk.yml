name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SaldoKu APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies & Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://umysveuuvouchvnakgwu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVteXN2ZXV1dm91Y2h2bmFrZ3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODgyNzksImV4cCI6MjEwOTU2NDI3OX0.-H1ZhcT50KXLSlfFN7qCwxzZ1lgyC4-ZjRsLPLoxVOY' }}
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/SaldoKu-v1.0-debug.apk
          echo "APK generated successfully:"
          ls -lh output/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaldoKu-Mobile-APK
          path: output/SaldoKu-v1.0-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-apk
          name: SaldoKu Mobile App (APK Terbaru)
          body: |
            ## 📱 SaldoKu Mobile APK
            Build otomatis aplikasi SaldoKu dari GitHub Actions.

            ### ⬇️ Download & Instalasi:
            1. Download file **`SaldoKu-v1.0-debug.apk`** di bawah.
            2. Buka file APK di HP Android Anda.
            3. Jika muncul peringatan *"Install unknown apps"* / *"Sumber tidak dikenal"*, pilih **Izinkan** / **Allow**.
            4. Aplikasi langsung dapat digunakan secara realtime!
          files: output/SaldoKu-v1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
